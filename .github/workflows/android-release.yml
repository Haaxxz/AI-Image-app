name: Build Signed Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-release:
    name: Build signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (API 35)
        uses: android-actions/setup-android@v2
        with:
          sdk: 'android-35'
          components: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}-${{ hashFiles('**/*.gradle*') }}

      - name: Make Gradle wrapper executable
        run: chmod +x ./code/gradlew

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Set defaults when secrets missing
          : "${KEY_ALIAS:=release}"
          : "${KEYSTORE_PASSWORD:=changeit}"
          : "${KEY_PASSWORD:=changeit}"

          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "Decoding provided keystore..."
            echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
          else
            echo "Generating ephemeral keystore..."
            keytool -genkeypair -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -keystore keystore.jks -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=CI, OU=CI, O=CI, L=City, ST=State, C=US"
          fi

      - name: Build release APK
        working-directory: ./code
        env:
          KEYSTORE_PATH: ${{ runner.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Use env vars if provided, otherwise fallback to values set in Prepare keystore step
          KEY_ALIAS=${KEY_ALIAS:-release}
          KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD:-changeit}
          KEY_PASSWORD=${KEY_PASSWORD:-changeit}

          ./gradlew :app:assembleRelease --no-daemon -PkeystoreFile=$PWD/../keystore.jks -PkeystorePassword="$KEYSTORE_PASSWORD" -PkeyAlias="$KEY_ALIAS" -PkeyPassword="$KEY_PASSWORD"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: ./code/app/build/outputs/apk/release/*.apk
