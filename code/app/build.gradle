plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.aiapp'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.aiapp"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def keystoreFile = System.getenv('KEYSTORE_PATH') ?: project.findProperty('keystoreFile') ?: null
            if (keystoreFile) {
                storeFile file(keystoreFile)
                storePassword System.getenv('KEYSTORE_PASSWORD') ?: project.findProperty('keystorePassword')
                keyAlias System.getenv('KEY_ALIAS') ?: project.findProperty('keyAlias')
                keyPassword System.getenv('KEY_PASSWORD') ?: project.findProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}